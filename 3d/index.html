<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Bot HQ 3D · Office</title>
<link rel="stylesheet" href="../style.css"><style>html,body{margin:0;overflow:hidden;background:#2a2320}canvas{display:block;touch-action:none}
